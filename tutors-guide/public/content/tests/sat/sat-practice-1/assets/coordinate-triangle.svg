<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="4" />
  
  <!-- Subtle Grid Background -->
  <defs>
    <pattern id="smallGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#smallGrid)" />

  <!-- Coordinate Axes -->
  <line x1="50" y1="300" x2="450" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="75" y1="320" x2="75" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  
  <text x="455" y="305" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">x</text>
  <text x="70" y="20" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">y</text>

  <!-- Triangle ABC -->
  <!-- A = (120, 270), B = (360, 270), C = (360, 90) -->
  <polygon points="120,270 360,270 360,90" fill="#f8fafc" stroke="#0f172a" stroke-width="3" />

  <!-- Right Angle Square at B (360, 270) -->
  <path d="M 335 270 L 335 245 L 360 245" fill="none" stroke="#0f172a" stroke-width="2" />

  <!-- Angle Theta Arc at A (120, 270) -->
  <path d="M 160 270 A 40 40 0 0 0 152 246" fill="none" stroke="#2563eb" stroke-width="2.5" />
  <text x="170" y="258" font-family="serif" font-size="18" font-style="italic" font-weight="bold" fill="#2563eb">θ</text>

  <!-- Labels -->
  <text x="105" y="295" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">A</text>
  <text x="375" y="295" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">B</text>
  <text x="365" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">C</text>

  <!-- Dimension Labels -->
  <text x="235" y="295" font-family="sans-serif" font-size="14" font-weight="600" fill="#475569">base = 4</text>
  <text x="380" y="185" font-family="sans-serif" font-size="14" font-weight="600" fill="#475569">height = 3</text>
</svg>
